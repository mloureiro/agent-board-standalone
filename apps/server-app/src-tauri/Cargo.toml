[workspace]
resolver = "3"
members = ["core"]
default-members = ["core"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.90"

[package]
name = "rumo-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rumo-server-core = { path = "core" }
serde_json = "1"
tauri = { version = "=2.12.6", features = ["tray-icon", "image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
