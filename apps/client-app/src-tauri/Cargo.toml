[workspace]
resolver = "3"
members = ["core"]
default-members = ["core"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.90"

[package]
name = "rumo-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rumo-client-core = { path = "core" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
# Exact pin: the multi-webview API behind "unstable" may change in a minor release.
tauri = { version = "=2.12.6", features = ["unstable"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSString", "NSThread", "NSValue"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
