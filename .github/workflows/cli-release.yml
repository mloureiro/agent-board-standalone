name: CLI release

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  binaries:
    name: build the CLI binaries
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: |
          if [ -f apps/cli/update-key.pub ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile --filter "@agent-board/cli..."
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#cli-v}"
          manifest="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "tag $TAG does not match apps/cli/package.json version $manifest" >&2
            exit 1
          fi
      - run: node apps/cli/scripts/compile.ts --all
      - run: node apps/cli/scripts/smoke.ts apps/cli/dist/release/board-linux-x64
      - working-directory: apps/cli/dist/release
        run: sha256sum board-linux-x64 board-linux-arm64 board-darwin-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: |
            apps/cli/dist/release/board-linux-x64
            apps/cli/dist/release/board-linux-arm64
            apps/cli/dist/release/board-darwin-arm64
            apps/cli/dist/release/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish the CLI release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release
      - working-directory: release
        run: sha256sum --check SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.binaries.outputs.signed }}
        run: |
          notes="CLI release $TAG. Install with apps/cli/scripts/install.sh or run board self-update."
          set -- --verify-tag --title "$TAG"
          if [ "$SIGNED" = "true" ]; then
            notes="$notes Draft until signed: run pnpm --filter @agent-board/cli release:sign $TAG on the machine holding the minisign key."
            set -- "$@" --draft
          fi
          gh release create "$TAG" \
            release/board-linux-x64 \
            release/board-linux-arm64 \
            release/board-darwin-arm64 \
            release/SHA256SUMS \
            "$@" \
            --notes "$notes"
