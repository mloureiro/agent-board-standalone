name: Mobile APK

on:
  push:
    tags:
      - 'mobile-v*'
    branches-ignore:
      - main
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS_VERSION: 35.0.0
  ANDROID_TARGET: aarch64

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android NDK and build tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-35"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/plugin/android/**', 'apps/mobile/src-tauri/tauri.conf.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-board/web... run build
      - run: pnpm --filter @agent-board/mobile run bundle
      - run: pnpm --filter @agent-board/mobile exec tauri android init --ci
      - run: pnpm --filter @agent-board/mobile exec tauri android build --apk --target "${ANDROID_TARGET}" --ci
      - name: Align and sign
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
        run: bash apps/mobile/scripts/sign-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-board-mobile-apk
          path: apps/mobile/dist-apk/agent-board-mobile.apk
          if-no-files-found: error
