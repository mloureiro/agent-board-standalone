name: Mobile APK

on:
  push:
    tags:
      - 'mobile-v*'
    branches-ignore:
      - main
    paths:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS_VERSION: 35.0.0
  ANDROID_TARGET: aarch64

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android NDK and build tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/plugin/android/**', 'apps/mobile/src-tauri/tauri.conf.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: pnpm --filter @rumo/mobile run release:check "${GITHUB_REF_NAME#mobile-v}"
      - run: pnpm --filter @rumo/web... run build
      - run: pnpm --filter @rumo/mobile run bundle
      - run: pnpm --filter @rumo/mobile exec tauri android init --ci
      - run: pnpm --filter @rumo/mobile exec tauri android build --apk --target "${ANDROID_TARGET}" --ci
      - name: Align and sign
        env:
          KEYSTORE_B64: ${{ startsWith(github.ref, 'refs/tags/mobile-v') && secrets.MOBILE_KEYSTORE_B64 || '' }}
          KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/mobile-v') && secrets.MOBILE_KEYSTORE_PASSWORD || '' }}
        run: bash apps/mobile/scripts/sign-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rumo-mobile-apk
          path: apps/mobile/dist-apk/rumo-mobile.apk
          if-no-files-found: error

  release:
    name: attach APK to the release
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rumo-mobile-apk
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag
          fi
          gh release upload "$TAG" dist/rumo-mobile.apk --clobber
