name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  sealing-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-board/sealing exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @agent-board/sealing test:bun
      - run: pnpm --filter @agent-board/sealing test:browser

  compat-matrix:
    name: compatibility matrix (N vs N-1)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder - step 4 runs each part at N against the other parts at N-1."
