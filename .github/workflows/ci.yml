name: CI

on:
  push:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_LISTED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'run' || 'skip' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e_blackbox: ${{ steps.plan.outputs.e2e_blackbox }}
      e2e_browser: ${{ steps.plan.outputs.e2e_browser }}
      compat: ${{ steps.plan.outputs.compat }}
      api_executable: ${{ steps.plan.outputs.api_executable }}
      sealing_runtimes: ${{ steps.plan.outputs.sealing_runtimes }}
      binary_smoke: ${{ steps.plan.outputs.binary_smoke }}
      mobile: ${{ steps.plan.outputs.mobile }}
      client_app: ${{ steps.plan.outputs.client_app }}
      install_alone: ${{ steps.plan.outputs.install_alone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: node tools/repo/src/affected.ts

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client-app/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm catalogue:check --check-column

  mobile-rust:
    name: mobile (rust)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri
      - run: pnpm install --frozen-lockfile --filter @agent-board/contract...
      - run: pnpm --filter @agent-board/contract run build
      - run: pnpm --filter @agent-board/mobile lint:rust
      - run: pnpm --filter @agent-board/mobile test:rust

  api-executable:
    needs: changes
    if: needs.changes.outputs.api_executable == 'true'
    runs-on: ubuntu-latest
    env:
      REQUIRE_BUN_EXECUTABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-board/api exec vitest run test/bun-executable.test.ts

  mobile-phone:
    name: mobile (phone)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-board/web... run build
      - run: pnpm --filter @agent-board/mobile exec playwright install --with-deps chromium
      - run: pnpm --filter @agent-board/mobile run bundle
      - run: pnpm --filter @agent-board/mobile run phone

  client-app-macos:
    name: client-app (macOS)
    needs: changes
    if: needs.changes.outputs.client_app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client-app/src-tauri
      - run: pnpm install --frozen-lockfile --filter "@agent-board/client-app..."
      - run: pnpm --filter "@agent-board/client-app..." --if-present run build
      - run: pnpm --filter @agent-board/client-app shell:check

  sealing-runtimes:
    needs: changes
    if: needs.changes.outputs.sealing_runtimes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-board/sealing exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @agent-board/sealing test:bun
      - run: pnpm --filter @agent-board/sealing test:browser

  e2e-blackbox:
    name: e2e (black-box)
    needs: changes
    if: needs.changes.outputs.e2e_blackbox == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_KEEP_TMP: '1'
      E2E_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm --filter @agent-board/e2e e2e:blackbox --strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-blackbox-logs
          path: |
            /tmp/agent-board-e2e-*/api.log
            /tmp/agent-board-e2e-*/machines/*/api.log
          if-no-files-found: ignore

  e2e-browser:
    name: e2e (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.e2e_browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-desktop, chromium-phone, webkit-phone]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_KEEP_TMP: '1'
      E2E_POSTGRES_URL: ${{ matrix.project == 'chromium-desktop' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @agent-board/e2e exec playwright --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @agent-board/e2e exec playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @agent-board/e2e exec playwright install-deps chromium webkit
      - run: pnpm -r --if-present run build
      - env:
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e-results
          PROJECT: ${{ matrix.project }}
        run: pnpm --filter @agent-board/e2e e2e:browser --strict -- --project "$PROJECT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-browser-${{ matrix.project }}-reports
          path: |
            ${{ runner.temp }}/e2e-results
            /tmp/agent-board-e2e-*/api.log
            /tmp/agent-board-e2e-*/machines/*/api.log
          if-no-files-found: ignore

  compat-matrix:
    name: compatibility matrix (N vs N-1)
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_KEEP_TMP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @agent-board/e2e exec playwright --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @agent-board/e2e exec playwright install --with-deps chromium webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @agent-board/e2e exec playwright install-deps chromium webkit
      - run: pnpm -r --if-present run build
      - run: pnpm --filter @agent-board/e2e e2e:matrix

  install-alone:
    name: install alone (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.install_alone != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.install_alone) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.package == 'client-app' || matrix.package == 'mobile'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles(format('apps/{0}/src-tauri/Cargo.toml', matrix.package)) != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.package }}/src-tauri
      - run: pnpm install --frozen-lockfile --filter "@agent-board/${{ matrix.package }}..."
      - run: pnpm --filter "@agent-board/${{ matrix.package }}..." --if-present run build
      - run: pnpm --filter "@agent-board/${{ matrix.package }}" run typecheck
      - run: pnpm --filter "@agent-board/${{ matrix.package }}" test

  binary-smoke:
    name: binary smoke (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.binary_smoke == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile --filter "@agent-board/cli..."
      - run: node apps/cli/scripts/compile.ts --target ${{ matrix.target }}
      - run: node apps/cli/scripts/smoke.ts apps/cli/dist/release/board-${{ matrix.target }}

  public-hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/repo/src/hygiene.ts
